name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: uv sync --dev

      - name: 静态检查（mypy）
        run: uv run mypy src/qtrader/

      - name: 代码风格（ruff）
        run: |
          uv run ruff check src/
          uv run ruff format --check src/

      - name: 单元与集成测试
        run: uv run pytest tests/unit/ tests/integration/ -q
