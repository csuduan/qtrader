[mypy]
python_version = 3.12
plugins = pydantic.mypy
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False

# 忽略第三方库缺少类型存根的警告
ignore_missing_imports = True

# 禁用部分严格检查以兼容SQLAlchemy
no_implicit_optional = False

# 指定需要忽略的文件或模块
[mypy-tqsdk.*]
ignore_missing_imports = True

[mypy-tqsdk.objs.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

# ============ 以下为存量类型债务，仅剩 3 个模块（2026-09 测量） ============
# 目标：逐模块修复后删除对应小节。修复时先删小节跑 mypy 看错误清单。

# qtrader.trader.switch_mgr: ~23 处（SQLAlchemy 旧式 Column 与 Optional 交叉）
[mypy-qtrader.trader.switch_mgr]
ignore_errors = True

# qtrader.trader.trader: ~44 处（推送/缓存路径上的 Optional 访问）
[mypy-qtrader.trader.trader]
ignore_errors = True

# qtrader.manager.api.routes: ~42 处（TraderProxy/Database 判空缺失，str|None 参数校验）
[mypy-qtrader.manager.api.routes.*]
ignore_errors = True
