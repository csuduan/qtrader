[project]
name = "qtrader"
version = "0.1.0"
description = "自动化交易程序"
authors = [
  {name = "csuduan", email = "csuduan@qq.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tqsdk>=2.15.0",
    "fastapi>=0.104.0",
    "fastapi_offline>=1.7.6",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.23",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "loguru>=0.7.2",
    "pyyaml>=6.0.1",
    "pandas>=2.1.3",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "watchdog>=3.0.0",
    "apscheduler>=3.10.4",
    "requests>=2.31.0",
    "tqsdk_zq_otg",
    "cachetools",
    "rqdatac",
    "psycopg[binary]>=3.1.0",
    "psutil>=5.9.0",
    "simplejson>=3.20.0",
    "ctpx==6.7.2.*"
    
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtrader"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
files = [
    "src/qtrader/",
    "!src/qtrader/__pycache__/",
]
