[pytest]
testpaths = tests
norecursedirs = tests/scripts .* build dist __pycache__ htmlcov .venv
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short --strict-markers
base_url = http://localhost:3000
markers =
    unit: 单元测试
    integration: 集成测试
    api: 真实后端API测试（需启动 Manager + Trader）
    e2e: 端到端测试（Playwright 前后端联调）
    slow: 标记慢速测试
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
